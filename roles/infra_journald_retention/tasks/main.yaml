- name: Ensure Journald Configuration Directory
  become: true
  ansible.builtin.file:
      state: directory
      path: /etc/systemd/journald.conf.d
      mode: "0755"

- name: Ensure Journald Configuration
  notify: [infra_journald_retention:config]
  become: true
  ansible.builtin.template:
      src: homelab.conf.j2
      dest: /etc/systemd/journald.conf.d/99-homelab.conf
      mode: "0644"
