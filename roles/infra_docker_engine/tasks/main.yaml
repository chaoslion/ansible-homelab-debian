- name: Add Docker Repository
  ansible.builtin.deb822_repository:
      state: present
      name: homelab-docker
      enabled: true
      uris: https://download.docker.com/linux/debian
      signed_by: https://download.docker.com/linux/debian/gpg
      suites:
          - "{{ ansible_facts.distribution_release }}"
      components:
          - stable

- name: Ensure Docker Packages Installed
  ansible.builtin.apt:
      state: present
      # explicit update required after adding repository
      update_cache: true
      cache_valid_time: 0
      package:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin

- name: Add User To Docker Group
  notify: [packages_docker:group]
  ansible.builtin.user:
      name: "{{ vars_group_homelab_nodes__config.admin.name }}"
      groups: docker
      append: true

- name: Create Docker Configuration
  notify: [packages_docker:config]
  ansible.builtin.template:
      src: daemon.json.j2
      dest: /etc/docker/daemon.json
      mode: "0644"

- name: Enable And Start Service
  ansible.builtin.systemd_service:
      state: started
      name: docker
      enabled: true
